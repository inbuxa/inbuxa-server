protocols = imap
listen = *
mail_location = maildir:/var/vmail/%u/Maildir
mail_uid = 5000
mail_gid = 5000
namespace inbox {
  inbox = yes
  separator = /
  prefix =
}
auth_mechanisms = plain login
disable_plaintext_auth = no
auth_master_user_separator = *
passdb {
  driver = passwd-file
  args = /etc/dovecot/masters
  master = yes
}
passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/var/vmail/%u
}
ssl = no
log_path = /dev/stderr
