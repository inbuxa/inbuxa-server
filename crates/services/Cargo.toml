[package]
name = "services"
version.workspace = true
edition = "2024"

[dependencies]
store = { path = "../store" }
nlp = { path = "../nlp" }
common = { path =  "../common" }
utils = { path =  "../utils" }
trc = { path = "../trc" }
email = { path = "../email" }
smtp = { path = "../smtp" }
groupware = { path = "../groupware" }
spam-filter = { path = "../spam-filter" }
types = { path = "../types" }
jmap_proto = { path = "../jmap-proto" }
jmap-tools = { version = "0.1" }
registry = { path =  "../registry" }
inbuxa-features = { path = "../features" }
smtp-proto = { version = "0.2", features = ["rkyv", "serde"] }
tokio = { version = "1.53", features = ["rt", "net", "time", "sync", "macros", "process", "fs", "io-util"] }
mail-parser = { version = "0.11", features = ["full_encoding", "rkyv"] }
mail-builder = { version = "1.0" }
aho-corasick = { version = "1.1" }
calcard = { version = "0.3", features = ["rkyv"] }
serde_json = "1.0"
memory-stats = "1.2.0"
aes-gcm = "0.11.1"
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.13"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"]}
base64 = "0.23"
dns-update = { version = "0.6" }
psl = "2"
# inbuxa: the deliverability check
mail-auth = { version = "0.13" }
futures = "0.3"
# inbuxa: links to inbuxa Relays (relay spec)
inbuxa-relay-proto = { path = "../relay-proto" }
rustls = { version = "0.23.43", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pki-types = { version = "1" }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = "0.30"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1"
x509-parser = "0.18"

[dev-dependencies]

[features]
test_mode = []
enterprise = []

[lints]
workspace = true
