[package]
name = "inbuxa-outbound-tls"
description = "Outbound SMTP TLS policy: DANE (RFC 7672) with DNSSEC lookups, and MTA-STS (RFC 8461) policies. Shared by the server and inbuxa-relay (docs/spec/features/relay.md, RL-30)"
license = "AGPL-3.0-only OR LicenseRef-SEL"
version.workspace = true
edition = "2024"

# Small on purpose: inbuxa-relay links it, so no inbuxa server crate.
[dependencies]
mail-auth = { version = "0.13", default-features = false, features = ["aws-lc-rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
x509-parser = { version = "0.18" }
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
idna = "1.1"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
