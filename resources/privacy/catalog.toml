#
# The personal-data catalog (docs/spec/features/personal-data-catalog.md).
#
# Every place the server can store or send personal data, as possibilities:
# what a particular server holds depends on its settings, and the server
# evaluates this file against them. Facts only; nothing here judges.
#
# Three kinds of entry:
#   [object."x:Name"]      a registry object from resources/schema/schema.json.gz
#   [object."inbuxa:Name"] one of inbuxa's own JMAP objects (crates/jmap-proto)
#   [source."name"]        anything that is no object: files, exporters, lookups
#
# An object's `default = "none"` covers every property not listed under its
# `.properties`. A property the schema types as an address, an IP or a secret
# is always listed. tools/fork/privacy-check.py enforces both, and that every
# object and setting named here exists.

[vocabulary]
categories = ["identifier", "contact", "network", "content", "metadata", "credential"]
whose = ["holder", "correspondent", "administrator"]
where = ["data-store", "blob-store", "search-store", "in-memory-store", "memory", "log-file", "external"]
scope = ["tenant", "server"]
retention = ["unbounded", "object-life", "receiver"]

# ---------------------------------------------------------------------------
# inbuxa's own objects. `file` names the jmap-proto source whose property
# names the check reads.

[object."inbuxa:AuditEvent"]
file = "inbuxa_audit.rs"
default = "none"
whose = ["administrator", "holder", "correspondent"]
where = ["data-store"]
scope = "tenant"
retention = { setting = "inbuxa:AuditSettings.keepForDays" }
[object."inbuxa:AuditEvent".properties]
actor = ["identifier"]
via = ["identifier"]
remoteIp = ["network"]
target = ["identifier"]
changes = ["content"]
details = ["content"]
reason = ["content"]
at = ["metadata"]

[object."inbuxa:AuditExport"]
file = "inbuxa_audit.rs"
default = "none"
whose = ["administrator", "holder", "correspondent"]
where = ["blob-store"]
scope = "tenant"
retention = { setting = "x:Jmap.uploadTtl" }
[object."inbuxa:AuditExport".properties]
blobId = ["identifier", "network", "content"]
filter = ["identifier"]

[object."inbuxa:AuditSettings"]
file = "inbuxa_audit.rs"
default = "none"

[object."inbuxa:AuditVerification"]
file = "inbuxa_audit.rs"
default = "none"

[object."inbuxa:AccountLock"]
file = "inbuxa_account_lock.rs"
default = "none"
whose = ["holder", "administrator"]
where = ["data-store"]
scope = "tenant"
retention = "unbounded"
[object."inbuxa:AccountLock".properties]
accountId = ["identifier"]
name = ["identifier"]
reason = ["content"]
lockedAt = ["metadata"]
lockedBy = ["identifier"]
delegates = ["identifier"]

[object."inbuxa:LegalHold"]
file = "inbuxa_legal_hold.rs"
default = "none"
whose = ["administrator", "holder"]
where = ["data-store"]
scope = "server"
retention = "unbounded"
[object."inbuxa:LegalHold".properties]
name = ["content"]
reference = ["content"]
description = ["content"]
scope = ["identifier"]
reason = ["content"]
placedBy = ["identifier"]
releasedBy = ["identifier"]
releaseReason = ["content"]

[object."inbuxa:HoldExport"]
file = "inbuxa_hold_export.rs"
default = "none"
whose = ["holder", "correspondent", "administrator"]
where = ["data-store", "blob-store"]
scope = "server"
retention = "unbounded"
[object."inbuxa:HoldExport".properties]
