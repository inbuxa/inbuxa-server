# ---------------------------------------------------------------------------
# Sources that are no object. Settings are `<object>.<property>`: a schema
# field object, or one of inbuxa's own.

[source."mail-and-groupware"]
categories = ["content", "identifier", "contact", "metadata"]
whose = ["holder", "correspondent"]
where = ["data-store", "blob-store"]
scope = "tenant"
retention = "unbounded"
captures = ["x:DataRetention.expungeTrashAfter", "x:DataRetention.expungeSubmissionsAfter"]
leaves_host = false
written_by = ["crates/email/src/message/ingest.rs", "crates/groupware/src/calendar/storage.rs", "crates/groupware/src/contact/storage.rs", "crates/groupware/src/file/storage.rs"]

[source."full-text-index"]
categories = ["content", "identifier", "contact", "metadata"]
whose = ["holder", "correspondent"]
where = ["search-store"]
scope = "tenant"
retention = "object-life"
enabled_by = ["x:Search.indexEmail", "x:Search.indexCalendar", "x:Search.indexContacts"]
captures = ["x:Search.indexEmailFields", "x:Search.indexCalendarFields", "x:Search.indexContactFields"]
leaves_host = false
written_by = ["crates/services/src/task_manager/index.rs"]

[source."trace-index"]
categories = ["network", "identifier", "metadata"]
whose = ["correspondent", "holder"]
where = ["search-store"]
scope = "server"
retention = { setting = "x:DataRetention.holdTracesFor" }
enabled_by = ["x:Search.indexTelemetry"]
captures = ["x:Search.indexTracingFields"]
leaves_host = false
written_by = ["crates/services/src/task_manager/index.rs"]

[source."log-file"]
categories = ["network", "identifier", "metadata"]
whose = ["correspondent", "holder", "administrator"]
where = ["log-file"]
scope = "server"
# Unset, every file is kept; a new install keeps 30 days
retention = { setting = "inbuxa:LogSettings.keepForDays" }
enabled_by = ["x:TracerLog.enable"]
captures = ["x:TracerLog.level", "x:TracerLog.events", "x:EventTracingLevel.level"]
leaves_host = false
written_by = ["crates/common/src/telemetry/tracers/log.rs", "crates/services/src/inbuxa_log_retention.rs"]

[source."console-and-journal"]
categories = ["network", "identifier", "metadata"]
whose = ["correspondent", "holder", "administrator"]
where = ["log-file"]
scope = "server"
retention = "receiver"
enabled_by = ["x:TracerStdout.enable"]
captures = ["x:TracerStdout.level"]
leaves_host = false
written_by = ["crates/common/src/telemetry/tracers/stdout.rs", "crates/common/src/telemetry/tracers/journald.rs"]

[source."otel-tracer"]
categories = ["network", "identifier", "metadata"]
whose = ["correspondent", "holder", "administrator"]
