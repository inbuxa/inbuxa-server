    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #f6f8fa;
            --card: #ffffff;
            --border: #e3e7ec;
            --text: #111827;
            --muted: #5b6472;
            --accent: #0f766e;
            --accent-fg: #ffffff;
            --info: #0e7490;
            --success: #15803d;
            --radius: 10px;
            --input-bg: #ffffff;
            --brand-ink: #1C4053;
            --danger: #b91c1c;
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --bg: #0b1220;
                --card: #111a2b;
                --border: #1f2a3d;
                --text: #e5e9f0;
                --muted: #9aa5b8;
                --accent: #2dd4bf;
                --accent-fg: #052e2b;
                --info: #67e8f9;
                --success: #4ade80;
                --input-bg: #0d1524;
                --brand-ink: #e5e9f0;
                --danger: #f87171;
            }
        }

        body {
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.5rem 2.25rem 2rem;
            width: 100%;
            max-width: 384px;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 72px;
            margin: 0.25rem auto 0.5rem;
        }

        .logo-wrap svg.default-logo {
            display: block;
            width: calc(100% + 1rem);
            height: auto;
            margin: -0.25rem auto 0.1rem;
            max-width: 320px;
        }

        .logo-wrap[data-loading] .default-logo {
            visibility: hidden;
        }

        .logo-wrap img.custom-logo {
            display: block;
            max-width: 220px;
            max-height: 96px;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .default-logo .wordmark {
            fill: var(--brand-ink)
        }

        h1 {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -.015em;
            margin-bottom: .25rem
        }

        .sub {
            font-size: .8125rem;
            color: var(--muted);
            margin-bottom: 1.75rem
        }

        .alert {
            display: flex;
            align-items: flex-start;
            gap: .625rem;
            padding: .625rem .75rem;
            background: color-mix(in srgb, var(--danger, #dc2626) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--danger, #dc2626) 30%, transparent);
            border-radius: 8px;
            font-size: .8125rem;
            color: var(--danger, #b91c1c);
            margin-bottom: .875rem;
        }

        .alert.success {
            background: color-mix(in srgb, #0f7a3c 10%, transparent);
            border-color: color-mix(in srgb, #0f7a3c 30%, transparent);
            color: #0f7a3c;
        }

        @media(prefers-color-scheme:dark) {
            .alert {
                color: #f4839a
            }

            .alert.success {
                color: #58c98a;
            }
        }

        .alert svg {
            flex-shrink: 0;
            margin-top: 1px
        }

        .fields {
            display: flex;
            flex-direction: column;
            gap: .875rem
        }

        .field label {
            font-size: .75rem;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: .03em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: .3125rem;
        }

        input[type=text],
        input[type=password],
        input[type=email] {
            width: 100%;
            padding: .5625rem .75rem;
            font-size: .9375rem;
            font-family: inherit;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            transition: border-color .15s;
            -webkit-appearance: none;
        }

        input[type=text]:focus,
        input[type=password]:focus,
        input[type=email]:focus {
            border-color: color-mix(in srgb, var(--info) 60%, transparent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--info) 12%, transparent);
        }

        input[type=text]::placeholder,
        input[type=password]::placeholder,
        input[type=email]::placeholder {
            color: var(--muted);
            opacity: .7
        }

        #otp {
            letter-spacing: .2em;
            font-size: 1.0625rem;
            text-align: center;
            font-variant-numeric: tabular-nums
        }

        #device-code {
            letter-spacing: .15em;
            font-size: 1.0625rem;
            text-align: center;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
        }

        .btn {
            width: 100%;
            margin-top: .375rem;
            padding: .625rem 0;
            font-size: .9375rem;
            font-weight: 500;
            font-family: inherit;
            background: var(--accent);
            color: var(--accent-fg);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: -.01em;
            transition: opacity .15s;
        }

        .btn:hover {
            opacity: .88
        }

        .btn:active {
            opacity: .75;
            transform: scale(.99)
        }

        .btn[disabled] {
            opacity: .55;
            cursor: not-allowed;
            transform: none;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

        </div>
        <h1 id="title">Sign in</h1>
        <p class="sub" id="subtitle">Enter your credentials to continue</p>

        <div class="alert" id="alert" hidden aria-live="polite">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span id="alert-msg"></span>
        </div>

        <form class="fields" id="login-form" novalidate>
            <div class="field" id="field-username">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="you@example.com" autocomplete="username"
                    autocapitalize="none" autocorrect="off" spellcheck="false" required>
            </div>
            <div class="field" id="field-password">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="••••••••"
                    autocomplete="current-password" required>
            </div>
            <div class="field" id="field-device-code" hidden>
                <label for="device-code">Device code</label>
                <input id="device-code" name="device-code" type="text" placeholder="XXXX-XXXX" autocomplete="off"
                    autocapitalize="characters" spellcheck="false">
            </div>
            <div class="field" id="field-otp" hidden>
                <label for="otp">One-time code</label>
                <input id="otp" name="otp" type="text" placeholder="000000" maxlength="6" inputmode="numeric"
                    pattern="\d{6}" autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn" id="submit-btn">Sign in</button>
        </form>
    </div>

    <script>
        (function () {
            'use strict';

            var $ = function (id) { return document.getElementById(id); };

            function setText(el, text) {
                // textContent is XSS-safe: never parses HTML.
                el.textContent = text == null ? '' : String(text);
            }

            function show(el) { if (el) el.hidden = false; }
            function hide(el) { if (el) el.hidden = true; }

            function showError(msg) {
                var a = $('alert');
                a.classList.remove('success');
                setText($('alert-msg'), msg);
                show(a);
            }

            function showSuccess(msg) {
                var a = $('alert');
                a.classList.add('success');
                setText($('alert-msg'), msg);
                show(a);
            }

            function clearAlert() { hide($('alert')); }

            var url = new URL(window.location.href);
            var params = url.searchParams;
            var isDevice = /\/device(\/|$)/.test(url.pathname);

            // Collected OAuth params for the code flow
            var oauth = {
                client_id: params.get('client_id') || '',
                redirect_uri: params.get('redirect_uri'),
                scope: params.get('scope'),
                state: params.get('state'),
                nonce: params.get('nonce'),
                code_challenge: params.get('code_challenge'),
                code_challenge_method: params.get('code_challenge_method'),
                resource: params.getAll('resource')
            };

            // This page is the OAuth authorization screen used by apps
            if (!isDevice && !oauth.redirect_uri) {
                hide($('login-form'));
                setText($('title'), 'Sign in with an app');
                setText($('subtitle'), 'This page is opened automatically by your mail, calendar or contacts app to authorize access to your account.');
                showError('This sign-in page cannot be used directly. Please start the sign-in from your app instead. (The required "redirect_uri" parameter is missing.)');
                // The logo loader below never runs on this path, so reveal the default logo here.
                $('logo-wrap').removeAttribute('data-loading');
                return;
            }

            // Prefill username from login_hint
            var loginHint = params.get('login_hint');
            if (loginHint) $('username').value = loginHint;

            // Device-flow specific UI
            if (isDevice) {
                setText($('title'), 'Authorize device');
                setText($('subtitle'), 'Sign in to approve this device.');
                show($('field-device-code'));
                var prefillCode = params.get('code');
                if (prefillCode) $('device-code').value = prefillCode;
            }

            var inMfa = false;
            var lastCreds = null; // { account_name, account_secret } cached to resubmit with OTP

            function enterMfaMode() {
                inMfa = true;
                hide($('field-username'));
                hide($('field-password'));
                if (isDevice) hide($('field-device-code'));
                show($('field-otp'));
                setText($('title'), 'Two-factor authentication');
                setText($('subtitle'), 'Enter the 6-digit code from your authenticator app.');
                clearAlert();
                setTimeout(function () { $('otp').focus(); }, 0);
            }

            (function loadCustomLogo() {
                var wrap = $('logo-wrap');
                function showDefault() { wrap.removeAttribute('data-loading'); }
                var target = '/logo';
                if (loginHint) {
                    var at = loginHint.lastIndexOf('@');
                    if (at !== -1 && at < loginHint.length - 1) {
                        target = '/logo?domain=' + encodeURIComponent(loginHint.slice(at + 1).toLowerCase());
                    }
                }
                // An image element, not fetch: it can follow /logo's redirect to
                // a URL logo on another origin (branding BT-26)
                var img = new Image();
                img.className = 'custom-logo';
                img.alt = 'Logo';
                img.onload = function () {
                    while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
                    wrap.appendChild(img);
                    wrap.removeAttribute('data-loading');
                };
                img.onerror = showDefault;
                img.src = target;
            })();

            function buildRequest(creds, otpValue) {
                if (isDevice) {
                    var req = {
                        type: 'authDevice',
                        accountName: creds.account_name,
                        accountSecret: creds.account_secret,
                        code: ($('device-code').value || '').trim()
                    };
                    if (otpValue) req.mfaToken = otpValue;
                    return req;
                }
                var r = {
                    type: 'authCode',
                    accountName: creds.account_name,
                    accountSecret: creds.account_secret,
                    clientId: oauth.client_id || ''
                };
                if (oauth.redirect_uri) r.redirectUri = oauth.redirect_uri;
                if (oauth.scope) r.scope = oauth.scope;
                if (oauth.state) r.state = oauth.state;
                if (oauth.nonce) r.nonce = oauth.nonce;
                if (oauth.code_challenge) r.codeChallenge = oauth.code_challenge;
                if (oauth.code_challenge_method) r.codeChallengeMethod = oauth.code_challenge_method;
                if (oauth.resource && oauth.resource.length) r.resource = oauth.resource;
                if (otpValue) r.mfaToken = otpValue;
                return r;
            }

            function performRedirect(clientCode, issuer) {
                // Build redirect_uri?code=<client_code>&state=<state>
                var target;
                try {
                    if (!oauth.redirect_uri) throw new Error('missing redirect_uri');
                    target = new URL(oauth.redirect_uri);
                } catch (e) {
                    console.log('Invalid or missing redirect_uri:', oauth.redirect_uri, e);
                    showError('Temporary server failure. If the problem persists, contact your administrator.');
                    return;
                }
                target.searchParams.set('code', clientCode);
                if (oauth.state) target.searchParams.set('state', oauth.state);
                target.searchParams.set('iss', issuer || url.origin);
                window.location.assign(target.toString());
            }

            function handleResponse(resp) {
                if (!resp || typeof resp !== 'object' || typeof resp.type !== 'string') {
                    console.log('Malformed login response:', resp);
                    showError('Temporary server failure. If the problem persists, contact your administrator.');
                    return;
                }
                switch (resp.type) {
                    case 'authenticated':
                        if (typeof resp.client_code !== 'string') {
                            console.log('Missing client_code in response:', resp);
                            showError('Temporary server failure. If the problem persists, contact your administrator.');
                            return;
                        }
                        performRedirect(resp.client_code, resp.iss);
                        return;
                    case 'verified':
                        hide($('login-form'));
                        setText($('title'), 'Device authorized');
                        setText($('subtitle'), 'You have successfully authorized this device. You may now close this window.');
                        clearAlert();
                        showSuccess('Device verified.');
                        return;
                    case 'mfaRequired':
                        enterMfaMode();
                        return;
                    case 'failure':
                        // Reset MFA state on failure so the user can retry credentials.
                        if (inMfa) {
                            inMfa = false;
                            show($('field-username'));
                            show($('field-password'));
                            if (isDevice) show($('field-device-code'));
                            hide($('field-otp'));
                            $('otp').value = '';
                            setText($('title'), isDevice ? 'Authorize device' : 'Sign in');
                            setText($('subtitle'), isDevice
                                ? 'Sign in to approve this device.'
                                : 'Enter your credentials to continue');
                        }
                        showError('Invalid username or password. Please try again.');
                        return;
                    default:
                        console.log('Unknown login response type:', resp);
                        showError('Temporary server failure. If the problem persists, contact your administrator.');
                }
            }

            function submitLogin(e) {
                if (e) e.preventDefault();
                clearAlert();

                var creds;
                if (inMfa) {
                    var otp = ($('otp').value || '').trim();
                    if (!otp) { showError('Please enter your one-time code.'); return; }
                    if (!lastCreds) {
                        // Safety net: shouldn't happen.
                        inMfa = false;
                        show($('field-username'));
                        show($('field-password'));
                        hide($('field-otp'));
                        showError('Session expired. Please sign in again.');
                        return;
                    }
                    creds = lastCreds;
                    var body = buildRequest(creds, otp);
                    postLogin(body);
                    return;
                }

                var username = ($('username').value || '').trim();
                var password = $('password').value || '';
                if (!username || !password) {
                    showError('Please enter your username and password.');
                    return;
                }
                if (isDevice) {
                    var devCode = ($('device-code').value || '').trim();
                    if (!devCode) {
                        showError('Please enter the device code.');
                        return;
                    }
                }
                creds = { account_name: username, account_secret: password };
                lastCreds = creds;
                postLogin(buildRequest(creds, null));
            }

            function postLogin(body) {
                var btn = $('submit-btn');
                btn.disabled = true;
                fetch('/api/auth', {
                    method: 'POST',
                    credentials: 'same-origin',
                    cache: 'no-store',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(body)
                }).then(function (res) {
                    if (res.status !== 200) {
                        return res.text().then(function (txt) {
                            console.log('Login endpoint returned HTTP', res.status, txt);
                            throw new Error('http ' + res.status);
                        });
                    }
                    return res.json().catch(function (err) {
                        console.log('Failed to parse login response JSON:', err);
                        throw err;
                    });
                }).then(function (json) {
                    handleResponse(json);
                }).catch(function (err) {
                    console.log('Login request failed:', err);
                    showError('Temporary server failure. If the problem persists, contact your administrator.');
                }).then(function () {
                    btn.disabled = false;
                });
            }

            $('login-form').addEventListener('submit', submitLogin);

            // Digit-only filter on OTP and auto-submit on 6 digits.
            $('otp').addEventListener('input', function () {
                this.value = this.value.replace(/\D/g, '');
                if (this.value.length === 6) submitLogin();
            });

            // Focus the first visible empty field.
            setTimeout(function () {
                if (!$('username').value) { $('username').focus(); return; }
                if (!$('password').value) { $('password').focus(); return; }
                if (isDevice && !$('device-code').value) { $('device-code').focus(); return; }
            }, 0);
        })();
    </script>
</body>

</html>
